<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Password Proktor</title>
<style>
body{font-family:Segoe UI,sans-serif;padding:20px;background:#f8fafc;margin:0}
h3{margin:0 0 15px 0;font-size:16px;color:#0f172a}
input{width:100%;padding:12px;font-size:16px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:6px;outline:none}
input:focus{border-color:#16a34a}
.btn{margin-top:16px;text-align:right}
button{padding:8px 16px;cursor:pointer;border-radius:4px;border:1px solid #cbd5e1}
#ok{background:#16a34a;color:white;border:0;margin-left:6px}
</style>
</head>
<body>
<h3>Keluar Exambro - Password Proktor</h3>
<input id="p" type="password" placeholder="Masukkan password proktor" />
<div class="btn">
<button onclick="window.close()">Batal</button>
<button id="ok">Keluar & Hapus Cache</button>
</div>
<script>
const { ipcRenderer } = require('electron');
const inp = document.getElementById('p');
setTimeout(()=>{ inp.focus(); }, 250);
document.getElementById('ok').onclick = () => {
  ipcRenderer.send('exit-with-password', inp.value);
};
inp.addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('ok').click();
  if(e.key==='Escape') window.close();
});
</script>
</body>
</html>
